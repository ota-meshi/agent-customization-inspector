# Continuous integration. Every gate is an independent job.
#
# Byte hygiene has no CI job: line endings are owned by .gitattributes and
# editor conventions by .editorconfig. Code formatting is Prettier's — the
# format job gates it — and code style beyond formatting is the lint job.
#
# The six lower-bound certification jobs sample Node.js 24.11.0 and 26.0.0
# on the three fixed OS/architecture targets. They certify the two declared
# lower bounds of the runtime compatibility contract `^24.11.0 || ^26.0.0`
# (exactly `>=24.11.0 <25.0.0 || >=26.0.0 <27.0.0`); the declared Node.js
# 24/26 engine ranges remain the compatibility contract, and these finite
# samples do not narrow support to the sampled versions. Node.js 24.18.0 on
# ubuntu-24.04 x64 is the development/build baseline.
name: CI

on:
  # Pull-request heads are validated by pull_request; push validates the
  # resulting main-branch state without running the same commit twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_DEV_BASELINE: 24.18.0

jobs:
  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run typecheck

  unit:
    # Includes the inspection traversal suite
    # (tests/unit/inspection/**) through the unit project glob (T039).
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run test:unit

  contract:
    name: Contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run test:contract

  integration:
    # Includes the traversal publication-boundary suite
    # (tests/integration/boundaries/**) through the integration project
    # glob (T039).
    name: Integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run test:integration

  package:
    # Includes the Node.js-only package-policy suite
    # (tests/package/node-only-policy.test.ts) through the package project
    # glob (T039).
    name: Package tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run verify:package
      - run: pnpm run test:package

  performance:
    # The T183 SC-002 smoke pass: harness integrity is gated, the recorded
    # timings are not. The suite drives the packaged CLI through a rendered
    # Chromium page, so the build and the browser install are prerequisites
    # of this job.
    name: Performance smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test:performance

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run test:coverage

  browser:
    # One job per Playwright project rather than all three browsers in a
    # single job: installing chromium, firefox, and webkit with their apt
    # dependencies together, then running the full suite three times over,
    # fills the runner's disk before the matrix run finishes (ENOSPC). Each
    # browser gets its own runner and its own disk budget, matching this
    # file's "every gate is an independent job" design.
    name: Browser certification suite (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      # The browser suite drives the packaged CLI (dist/cli.mjs serving
      # dist/public), so the build is a prerequisite of this job.
      - run: pnpm run build
      # The instrumentation that named the ENOSPC above, not a gate, and still
      # temporary: it stays for one run to show the low-water reports gone now
      # that the suite step forbids the core dumps, and goes with the next
      # change to this file.
      #
      # It samples during the suite rather than measuring around it because
      # nothing accumulates — a run that fails with ENOSPC leaves the disk
      # unchanged either side of it, and /tmp grows by 4 MB over a whole run —
      # so what takes the runner's 12 GB of free space gives it back within
      # one run. A file already unlinked holds its blocks while some process
      # still has it open, which is invisible to `du` and to any measurement
      # taken once the suite has ended; `lsof +L1` at the low-water moment is
      # what named the holder.
      #
      # Every step here clears the runner's `-e` and `pipefail` first, because
      # `du`, `lsof`, and `dmesg` all exit non-zero on something they cannot
      # read — and the failing command would take every measurement after it
      # down with it, which is the whole output.
      - name: Disk usage before the suite
        run: |
          set +e +o pipefail
          df -h /
          df -i /
          du -xh -d 1 /tmp 2>/dev/null | sort -h | tail -10
      - name: Run primary-workflow and accessibility suite
        run: |
          set +e +o pipefail
          # No core from a browser this suite crashes. WebKit's
          # ThreadedCompositor and SkiaGPUWorker threads segfault a handful of
          # times per run, and `kernel.core_pattern` hands every crash to
          # systemd-coredump under a size limit of 2^63: three unlinked cores
          # of 4.5 GB, 1.9 GB, and 1.9 GB were open at once, which is 8 GB of
          # the runner's 12 GB of free space, and the lowest reading of that
          # run was 4 kB — one unlucky write away from the ENOSPC this job had
          # been failing with. The crashes cost the suite nothing on their own,
          # since it passed all 340 tests through six of them, so what has to
          # stop is the dumping: at RLIMIT_CORE zero the kernel writes no core
          # and never reaches systemd-coredump, and every browser process
          # Playwright spawns inherits the limit.
          ulimit -c 0
          samples="$RUNNER_TEMP/disk-samples.tsv"
          low_water="$RUNNER_TEMP/disk-low-water.log"
          (
            while :; do
              read -r avail iavail <<<"$(df --output=avail,iavail / | tail -1)"
              printf '%s\t%s\t%s\n' "$avail" "$iavail" "$(date -Is)" >> "$samples"
              # 4 GiB of the 12 GB the runner starts with: low enough that a
              # steady suite never reaches it, high enough to still catch the
              # holder before the write that fails.
              if [ "$avail" -lt 4194304 ]; then
                {
                  printf '=== %s avail_kb=%s inodes_free=%s\n' "$(date -Is)" "$avail" "$iavail"
                  sudo lsof -n +L1 2>/dev/null | head -30
                } >> "$low_water"
              fi
              sleep 1
            done
          ) &
          sampler=$!
          # No `--` before the flag: Playwright's CLI treats a literal `--`
          # token as the start of its own positional test-file filters, so
          # `pnpm run test:e2e -- --project=x` silently drops the project
          # filter and runs every project's tests instead of just `x`.
          pnpm run test:e2e --project=${{ matrix.browser }}
          status=$?
          # The sampler is this step's own background process and never
          # outlives it, whether the suite passed or failed.
          kill "$sampler" 2>/dev/null
          exit "$status"
      - name: Disk usage after the suite
        if: always()
        run: |
          set +e +o pipefail
          df -h /
          df -i /
          echo '--- the ten lowest readings: avail_kb, inodes_free, time ---'
          sort -n "$RUNNER_TEMP/disk-samples.tsv" 2>/dev/null | head -10
          echo '--- every low-water report ---'
          head -120 "$RUNNER_TEMP/disk-low-water.log" 2>/dev/null
          # A browser process crashing and dumping a multi-gigabyte core fits
          # a spike that leaves nothing behind, so this is where its evidence
          # would be.
          echo '--- core pattern and crash directories ---'
          cat /proc/sys/kernel/core_pattern
          ls -la /var/crash /var/lib/apport/coredump /var/lib/systemd/coredump 2>&1 | head -30
          echo '--- kernel messages ---'
          sudo dmesg 2>/dev/null | grep -iE 'segfault|core dump|out of memory|no space' | tail -30
          echo '--- what is on disk now ---'
          du -xh -d 1 /tmp 2>/dev/null | sort -h | tail -20
          du -xh -d 2 "$GITHUB_WORKSPACE" 2>/dev/null | sort -h | tail -20

  build:
    name: Development/build baseline (Node.js 24.18.0, ubuntu-24.04 x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_DEV_BASELINE }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Packaged-artifact verification is a CI/release gate, not part of
      # every local build (Implementation simplicity policy).
      - run: pnpm run verify:package

  certify-lower-bounds:
    name: Certify Node.js ${{ matrix.node }} on ${{ matrix.os }}
    # Six jobs: the two declared engine lower bounds crossed with the three
    # fixed OS/architecture targets (ubuntu-24.04 x64, macos-15 arm64,
    # windows-2025 x64). See the header note: the declared Node.js 24/26
    # ranges remain the compatibility contract, not these samples.
    strategy:
      fail-fast: false
      matrix:
        node: ['24.11.0', '26.0.0']
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run dev:prepare
      - run: pnpm run test:unit
